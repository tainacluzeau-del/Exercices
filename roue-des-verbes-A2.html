    --accent: #d9622b;

  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a;

      --ring: #334155;
      --tag-bg: #334155;
    }
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    padding: 24px 16px;
    line-height: 1.5;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--ring);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }
  .nav-btn:hover { background: var(--tag-bg); color: var(--primary); }
