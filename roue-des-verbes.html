<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La roue des verbes — Exercice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --success: #10b981;
    --error: #ef4444;
    --bg: #f8fafc;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-soft: #64748b;
    --ring: #e2e8f0;
    --tag-bg: #f1f5f9;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a;
      --card: #1e293b;
      --ink: #f8fafc;
      --ink-soft: #94a3b8;
      --ring: #334155;
      --tag-bg: #334155;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    line-height: 1.5;
  }

  .wrap { max-width: 650px; margin: 0 auto; }

  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--ring);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }

  .nav-btn:hover {
    background: var(--tag-bg);
    color: var(--primary);
  }

  header {
    text-align: center;
    background: var(--card);
    padding: 24px 20px;
    border-radius: 20px;
    border: 1px solid var(--ring);
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
  }

  h1 { font-size: 24px; margin: 0 0 6px; font-weight: 800; }
  p { color: var(--ink-soft); margin: 0; font-size: 14px; }

  .game-card {
    background: var(--card);
    border: 1px solid var(--ring);
    border-radius: 20px;
    padding: 24px;
    box-shadow: var(--shadow-md);
  }

  .score-board {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }

  /* --- STYLE DES ROUES ANIMEES --- */
  .wheels-wrapper {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }

  .wheel-column {
    background: var(--tag-bg);
    border: 2px solid var(--ring);
    border-radius: 16px;
    padding: 12px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .wheel-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    font-weight: 800;
    margin-bottom: 8px;
    display: block;
  }

  .wheel-window {
    height: 70px;
    overflow: hidden;
    position: relative;
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--ring);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
  }

  .wheel-strip {
    position: absolute;
    width: 100%;
    top: 0;
    left: 0;
    transition: transform 0.1s linear;
  }

  .wheel-item {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    color: var(--primary);
  }

  .btn {
    width: 100%;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
  }

  .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  form {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--ring);
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
    background: var(--bg);
    color: var(--ink);
    outline: none;
  }

  input[type="text"]:focus {
    border-color: var(--primary);
  }

  .feedback {
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    text-align: center;
    display: none;
  }

  .feedback.correct {
    background: rgba(16, 185, 129, 0.15);
    color: var(--success);
  }

  .feedback.wrong {
    background: rgba(239, 68, 68, 0.15);
    color: var(--error);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav-bar">
    <a class="nav-btn" href="index.html">◂ Retour aux exercices</a>
    <a class="nav-btn" href="https://tainacluzeau-del.github.io/Vocabulaire/">📚 Vocabulaire ↗</a>
  </div>

  <header>
    <h1>🎡 La roue des verbes (1er groupe)</h1>
    <p>Tourne les roues, puis écris la phrase complète au présent !</p>
  </header>

  <div class="game-card">
    <div class="score-board">
      <span>Score : <strong id="scoreVal">0</strong></span>
      <span>Essai : <strong id="roundVal">0</strong></span>
    </div>

    <div class="wheels-wrapper">
      <div class="wheel-column">
        <span class="wheel-label">Sujet</span>
        <div class="wheel-window">
          <div class="wheel-strip" id="sujetStrip">
            <div class="wheel-item">?</div>
          </div>
        </div>
      </div>

      <div class="wheel-column">
        <span class="wheel-label">Verbe (1er groupe)</span>
        <div class="wheel-window">
          <div class="wheel-strip" id="verbeStrip">
            <div class="wheel-item">?</div>
          </div>
        </div>
      </div>
    </div>

    <button class="btn" id="spinBtn" onclick="spin()">Tourner les roues 🎲</button>

    <form id="answerForm" onsubmit="checkAnswer(event)" style="display: none;">
      <input type="text" id="userInput" placeholder="Écris la phrase complète (ex: Je parle)..." autocomplete="off" required>
      <button class="btn" type="submit">Valider</button>
    </form>

    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
  const SUJETS = ['Je', 'Tu', 'Il', 'Elle', 'Nous', 'Vous', 'Ils', 'Elles'];

  // LISTE DE VERBES DU 1ER GROUPE EN -ER
  const VERBES = [
    { nom: 'Parler', conj: { 'Je': 'Je parle', 'Tu': 'Tu parles', 'Il': 'Il parle', 'Elle': 'Elle parle', 'Nous': 'Nous parlons', 'Vous': 'Vous parlez', 'Ils': 'Ils parlent', 'Elles': 'Elles parlent' } },
    { nom: 'Habiter', conj: { 'Je': "J'habite", 'Tu': 'Tu habites', 'Il': 'Il habite', 'Elle': 'Elle habite', 'Nous': 'Nous habitons', 'Vous': 'Vous habitez', 'Ils': 'Ils habitent', 'Elles': 'Elles habitent' } },
    { nom: 'Aimer', conj: { 'Je': "J'aime", 'Tu': 'Tu aimes', 'Il': 'Il aime', 'Elle': 'Elle aime', 'Nous': 'Nous aimons', 'Vous': 'Vous aimez', 'Ils': 'Ils aiment', 'Elles': 'Elles aiment' } },
    { nom: 'Regarder', conj: { 'Je': 'Je regarde', 'Tu': 'Tu regardes', 'Il': 'Il regarde', 'Elle': 'Elle regarde', 'Nous': 'Nous regardons', 'Vous': 'Vous regardez', 'Ils': 'Ils regardent', 'Elles': 'Elles regardent' } },
    { nom: 'Écouter', conj: { 'Je': "J'écoute", 'Tu': 'Tu écoutes', 'Il': 'Il écoute', 'Elle': 'Elle écoute', 'Nous': 'Nous écoutons', 'Vous': 'Vous écoutez', 'Ils': 'Ils écoutent', 'Elles': 'Elles écoutent' } },
    { nom: 'Travailler', conj: { 'Je': 'Je travaille', 'Tu': 'Tu travailles', 'Il': 'Il travaille', 'Elle': 'Elle travaille', 'Nous': 'Nous travaillons', 'Vous': 'Vous travaillez', 'Ils': 'Ils travaillent', 'Elles': 'Elles travaillent' } },
    { nom: 'Manger', conj: { 'Je': 'Je mange', 'Tu': 'Tu manges', 'Il': 'Il mange', 'Elle': 'Elle mange', 'Nous': 'Nous mangeons', 'Vous': 'Vous mangez', 'Ils': 'Ils mangent', 'Elles': 'Elles mangent' } },
    { nom: 'Jouer', conj: { 'Je': 'Je joue', 'Tu': 'Tu joues', 'Il': 'Il joue', 'Elle': 'Elle joue', 'Nous': 'Nous jouons', 'Vous': 'Vous jouez', 'Ils': 'Ils jouent', 'Elles': 'Elles jouent' } },
    { nom: 'Chanter', conj: { 'Je': 'Je chante', 'Tu': 'Tu chantes', 'Il': 'Il chante', 'Elle': 'Elle chante', 'Nous': 'Nous chantons', 'Vous': 'Vous chantez', 'Ils': 'Ils chantent', 'Elles': 'Elles chantent' } },
    { nom: 'Danser', conj: { 'Je': 'Je danse', 'Tu': 'Tu danses', 'Il': 'Il danse', 'Elle': 'Elle danse', 'Nous': 'Nous dansons', 'Vous': 'Vous dansez', 'Ils': 'Ils dansent', 'Elles': 'Elles dansent' } }
  ];

  let currentSujet = '';
  let currentVerbeObj = null;
  let score = 0;
  let round = 0;

  function spin() {
    const spinBtn = document.getElementById('spinBtn');
    const form = document.getElementById('answerForm');
    const feedback = document.getElementById('feedback');
    const sujetStrip = document.getElementById('sujetStrip');
    const verbeStrip = document.getElementById('verbeStrip');

    spinBtn.disabled = true;
    form.style.display = 'none';
    feedback.style.display = 'none';

    // Sélection aléatoire
    currentSujet = SUJETS[Math.floor(Math.random() * SUJETS.length)];
    currentVerbeObj = VERBES[Math.floor(Math.random() * VERBES.length)];

    // Génération du rouleau visuel
    let sujetList = [];
    let verbeList = [];
    for (let i = 0; i < 12; i++) {
      sujetList.push(SUJETS[Math.floor(Math.random() * SUJETS.length)]);
      verbeList.push(VERBES[Math.floor(Math.random() * VERBES.length)].nom);
    }
    sujetList.push(currentSujet);
    verbeList.push(currentVerbeObj.nom);

    sujetStrip.innerHTML = sujetList.map(s => `<div class="wheel-item">${s}</div>`).join('');
    verbeStrip.innerHTML = verbeList.map(v => `<div class="wheel-item">${v}</div>`).join('');

    sujetStrip.style.transition = 'none';
    verbeStrip.style.transition = 'none';
    sujetStrip.style.transform = 'translateY(0px)';
    verbeStrip.style.transform = 'translateY(0px)';

    setTimeout(() => {
      const targetY = -(sujetList.length - 1) * 70;
      sujetStrip.style.transition = 'transform 1.8s cubic-bezier(0.15, 0.85, 0.35, 1.2)';
      verbeStrip.style.transition = 'transform 2.2s cubic-bezier(0.15, 0.85, 0.35, 1.2)';
      
      sujetStrip.style.transform = `translateY(${targetY}px)`;
      verbeStrip.style.transform = `translateY(${targetY}px)`;
    }, 50);

    setTimeout(() => {
      spinBtn.disabled = false;
      form.style.display = 'flex';
      document.getElementById('userInput').value = '';
      document.getElementById('userInput').focus();

      round++;
      document.getElementById('roundVal').textContent = round;
    }, 2300);
  }

  function cleanString(str) {
    return str.toLowerCase().trim().replace(/\s+/g, ' ').replace(/’/g, "'");
  }

  function checkAnswer(e) {
    e.preventDefault();
    const userVal = cleanString(document.getElementById('userInput').value);
    const expected = currentVerbeObj.conj[currentSujet];
    const expectedClean = cleanString(expected);

    const feedback = document.getElementById('feedback');
    feedback.style.display = 'block';

    if (userVal === expectedClean) {
      score++;
      document.getElementById('scoreVal').textContent = score;
      feedback.className = 'feedback correct';
      feedback.textContent = '🎉 Bravo ! C\'est la bonne réponse.';
      if (typeof confetti === 'function') confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
    } else {
      feedback.className = 'feedback wrong';
      feedback.textContent = `❌ Dommage ! La réponse attendue était : "${expected}"`;
    }
  }
</script>
</body>
</html>
