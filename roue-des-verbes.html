<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La roue des verbes — Exercice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #f8fafc;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-soft: #64748b;
    --ring: #e2e8f0;
    --tag-bg: #f1f5f9;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a;
      --card: #1e293b;
      --ink: #f8fafc;
      --ink-soft: #94a3b8;
      --ring: #334155;
      --tag-bg: #334155;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px));
    line-height: 1.5;
  }

  .wrap { max-width: 700px; margin: 0 auto; }

  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--ring);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }

  .nav-btn:hover {
    background: var(--tag-bg);
    color: var(--primary);
  }

  header {
    text-align: center;
    background: var(--card);
    padding: 28px 20px;
    border-radius: 20px;
    border: 1px solid var(--ring);
    box-shadow: var(--shadow-sm);
    margin-bottom: 24px;
  }

  h1 { font-size: 26px; margin: 0 0 8px; font-weight: 800; }
  p { color: var(--ink-soft); margin: 0; font-size: 15px; }

  .game-box {
    background: var(--card);
    border: 1px solid var(--ring);
    border-radius: 20px;
    padding: 28px 20px;
    text-align: center;
    box-shadow: var(--shadow-md);
  }

  .wheels-container {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin: 20px 0;
    flex-wrap: wrap;
  }

  .wheel-card {
    flex: 1;
    min-width: 140px;
    background: var(--tag-bg);
    border: 1px solid var(--ring);
    border-radius: 14px;
    padding: 20px 12px;
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
  }

  .wheel-label {
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    display: block;
  }

  .action-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .action-btn:hover { background: var(--primary-hover); }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav-bar">
    <a class="nav-btn" href="index.html">◂ Retour aux exercices</a>
    <a class="nav-btn" href="https://tainacluzeau-del.github.io/Vocabulaire/">📚 Vocabulaire ↗</a>
  </div>

  <header>
    <h1>🎡 La roue des verbes</h1>
    <p>Tire un sujet et un verbe, puis forme la phrase au présent.</p>
  </header>

  <div class="game-box">
    <div class="wheels-container">
      <div class="wheel-card">
        <span class="wheel-label">Sujet</span>
        <div id="subjectSlot">?</div>
      </div>
      <div class="wheel-card">
        <span class="wheel-label">Verbe</span>
        <div id="verbSlot">?</div>
      </div>
    </div>
    <button class="action-btn" onclick="spin()">Tourner les roues 🎲</button>
  </div>
</div>

<script>
  const SUJETS = ['Je', 'Tu', 'Il / Elle', 'Nous', 'Vous', 'Ils / Elles'];
  const VERBES = ['Parler', 'Finir', 'Avoir', 'Être', 'Faire', 'Aller', 'Prendre', 'Vouloir'];

  function spin() {
    const randomSubject = SUJETS[Math.floor(Math.random() * SUJETS.length)];
    const randomVerb = VERBES[Math.floor(Math.random() * VERBES.length)];
    
    document.getElementById('subjectSlot').textContent = randomSubject;
    document.getElementById('verbSlot').textContent = randomVerb;
  }
</script>
</body>
</html>
