<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Atelier du Français — Textes à trous interactifs</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal-animation {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center justify-center p-3 sm:p-6">

    <!-- En-tête de la page avec bouton de retour index -->
    <header class="w-full max-w-2xl mb-4 flex items-center justify-between">
        <a href="https://tainacluzeau-del.github.io/Exercices/" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-semibold text-indigo-700 hover:text-indigo-900 bg-white hover:bg-indigo-50 px-3.5 py-2 rounded-xl transition border border-indigo-200 shadow-xs">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
            <span>Retour aux exercices</span>
        </a>
        <div class="text-right hidden sm:block">
            <h1 class="text-sm font-bold text-indigo-950">L'Atelier du Français</h1>
            <p class="text-[11px] text-slate-500">Textes à trous</p>
        </div>
    </header>

    <!-- Conteneur principal de l'exercice -->
    <main class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden flex flex-col">
        
        <!-- Barre de sélection et d'état -->
        <div class="px-5 py-3.5 bg-indigo-50/70 border-b border-indigo-100 flex flex-col sm:flex-row items-center justify-between gap-3">
            <!-- Sélecteur de texte -->
            <div class="w-full sm:w-auto flex items-center gap-2">
                <label for="text-selector" class="text-xs font-semibold text-indigo-900 uppercase tracking-wider shrink-0">Texte :</label>
                <select id="text-selector" onchange="changeText(this.value)" class="bg-white text-indigo-950 text-xs sm:text-sm font-medium rounded-lg p-1.5 outline-none border border-indigo-200 cursor-pointer w-full sm:w-auto shadow-xs">
                    <option value="camille" selected>A1 - Unité 2 : "j'aime" (Camille Moreau)</option>
                </select>
            </div>

            <!-- Bouton Recommencer -->
            <button onclick="resetExercise()" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-700 hover:text-indigo-900 bg-white hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition border border-indigo-200 shadow-xs shrink-0 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 016 6v3" />
                </svg>
                <span>Recommencer</span>
            </button>
        </div>

        <!-- Informations sur le texte actif -->
        <div class="px-6 pt-5 pb-2">
            <span id="text-badge" class="text-[10px] uppercase tracking-wider bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded-full font-bold">A1 — Unité 2</span>
            <h2 id="text-title" class="text-xl font-bold text-indigo-950 mt-2">Camille Moreau</h2>
            <p id="text-subtitle" class="text-slate-600 text-xs sm:text-sm mt-0.5">Cliquez sur chaque espace vide pour choisir la bonne proposition.</p>
        </div>

        <!-- Zone du texte interactif -->
        <div id="text-window" class="p-5 sm:p-8 leading-loose text-slate-700 text-sm sm:text-base whitespace-pre-line">
            <!-- Injecté dynamiquement par JavaScript -->
        </div>

        <!-- Pied de page / Score -->
        <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs">
            <span id="score-indicator" class="font-bold text-indigo-900">Progrès : 0 / 16 résolus</span>
            <span class="text-slate-500 hidden sm:inline">💡 Vert = correct, Rouge = erreur (cliquez pour réessayer)</span>
        </div>
    </main>

    <!-- Modale de sélection des propositions -->
    <div id="gap-modal-container" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-5 max-w-sm w-full border border-slate-200 modal-animation">
            <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-100">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-700">Choisissez la bonne option</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg p-1 cursor-pointer">×</button>
            </div>
            <div id="modal-choices-list" class="flex flex-col gap-2">
                <!-- Propositions injectées dynamiquement -->
            </div>
        </div>
    </div>

    <!-- Modale d'explication en cas d'erreur -->
    <div id="error-modal-container" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-5 max-w-sm w-full border border-rose-200 modal-animation text-center">
            <div class="w-10 h-10 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-3 text-lg font-bold">
                ⚠️
            </div>
            <h3 class="text-sm font-bold text-rose-900 mb-1">Rappel grammatical</h3>
            <p id="error-explanation-text" class="text-xs sm:text-sm text-slate-600 mb-5 leading-relaxed">
                <!-- Explication injectée -->
            </p>
            <button onclick="closeErrorModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl text-xs sm:text-sm transition cursor-pointer">
                J'ai compris
            </button>
        </div>
    </div>

    <script>
        // --- BASE DE DONNÉES DES TEXTES ---
        const textsDatabase = {
            camille: {
                badge: "A1 — Unité 2 : Thématique \"j'aime\"",
                title: "Camille Moreau",
                subtitle: "Cliquez sur chaque espace vide pour choisir la bonne proposition.",
                gaps: [
                    { 
                        choices: ["m'appelle", "mapelle", "m'appel"],
                        explanation: "Pour se présenter avec le verbe s'appeler, on écrit 'je m'appelle' (avec deux 'p' et un 'e' final)."
                    },
                    { 
                        choices: ["J'ai 32 ans", "Je suis 32", "Je suis 32 ans"],
                        explanation: "En français, on utilise le verbe **avoir** pour exprimer l'âge (ex: J'ai 32 ans)."
                    },
                    { 
                        choices: ["habite", "habites", "habitent"],
                        explanation: "Avec 'je', la terminaison du verbe habiter au présent est '-e' (j'habite)."
                    },
                    { 
                        choices: ["et", "ou", "alors"],
                        explanation: "On utilise 'et' pour ajouter une deuxième information (j'habite à Lyon et je travaille...)."
                    },
                    { 
                        choices: ["boulangère", "boulanger", "boulangers"],
                        explanation: "Camille est une femme. On utilise la forme féminine : boulangère."
                    },
                    { 
                        choices: ["voyager", "des voyages", "voyage"],
                        explanation: "Après un verbe de goût comme 'j'adore', le verbe suivant s'écrit à l'infinitif (voyager)."
                    },
                    { 
                        choices: ["marcher", "marchait", "marche"],
                        explanation: "Avec les verbes d'appréciation ('j'aime'), le verbe suivant est à l'infinitif "marcher"."
                    },
                    { 
                        choices: ["Mon", "Son", "Ton"],
                        explanation: "Camille parle de son propre mari à la 1ère personne : 'Mon mari'."
                    },
                    { 
                        choices: ["professeur", "un professeur", "une professeure"],
                        explanation: "On ne met pas d'article indéfini (un/une) directement devant une profession après le verbe être (est professeur)."
                    },
                    { 
                        choices: ["et", "ou", "alors"],
                        explanation: "On utilise 'et' pour lier deux langues parlées (français et anglais)."
                    },
                    { 
                        choices: ["aime", "aiment", "aimes"],
                        explanation: "Le sujet est 'Il' (3e personne du singulier) : 'Il aime'."
                    },
                    { 
                        choices: ["aimons", "aimez", "aiment"],
                        explanation: "Avec le pronom 'Nous', la terminaison est '-ons' (Nous aimons)."
                    },
                    { 
                        choices: ["des", "un", "une"],
                        explanation: "Marco et Elena sont au pluriel. On utilise l'article indéfini pluriel 'des'."
                    },
                    { 
                        choices: ["habitent", "habites", "habitons"],
                        explanation: "Le sujet est 'Ils' (3e personne du pluriel), la terminaison du verbe est '-ent'."
                    },
                    { 
                        choices: ["adorent", "aidorent", "édorent"],
                        explanation: "Orthographe correcte : le verbe adorer s'écrit avec un 'a' initial."
                    },
                    { 
                        choices: ["danser", "une danse", "dansent"],
                        explanation: "Après le verbe 'détester', le verbe d'action se met à l'infinitif (danser)."
                    }
                ],
                template: `« Je {0} Camille Moreau. {1} et je suis française. J'{2} à Lyon {3} je travaille dans une boulangerie. Je suis {4}. J'adore {5} et j'aime {6}.\n\n{7} mari, Julien, est {8}. Il parle français {9} anglais. Il {10} cuisiner. Nous {11} danser ensemble.\n\nNous avons {12} amis, Marco et Elena. Ils {13} à Milan. Ils {14} chanter, mais ils détestent {15} ! »`
            }
        };

        let currentTextKey = "camille";
        let gapStates = {}; 
        let activeGapIndex = null;

        function changeText(key) {
            currentTextKey = key;
            gapStates = {}; 
            renderExercise();
        }

        function renderExercise() {
            const data = textsDatabase[currentTextKey];
            
            document.getElementById('text-badge').innerText = data.badge;
            document.getElementById('text-title').innerText = data.title;
            document.getElementById('text-subtitle').innerText = data.subtitle;

            let htmlText = data.template;

            data.gaps.forEach((gap, index) => {
                let currentVal = gapStates[index];
                let displayHtml = "";
                
                if (!currentVal) {
                    // Trou non rempli (bouton avec les points de suspension)
                    displayHtml = `<button onclick="openGapModal(${index})" class="inline-flex items-center justify-center px-2.5 py-1 mx-1 my-0.5 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-700 rounded-lg text-xs sm:text-sm font-bold transition shadow-2xs align-baseline cursor-pointer tracking-widest">...</button>`;
                } else if (currentVal.correct) {
                    // Bonne réponse
                    displayHtml = `<span class="inline-block px-2.5 py-1 mx-1 my-0.5 bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-lg text-xs sm:text-sm font-semibold">${currentVal.text}</span>`;
                } else {
                    // Mauvaise réponse (cliquable pour re-tester)
                    displayHtml = `<button onclick="openGapModal(${index})" class="inline-flex items-center gap-1 px-2.5 py-1 mx-1 my-0.5 bg-rose-100 hover:bg-rose-200 border border-rose-300 text-rose-700 rounded-lg text-xs sm:text-sm font-semibold transition shadow-2xs align-baseline cursor-pointer" title="Erreur - Cliquez pour réessayer">${currentVal.text} ❌</button>`;
                }

                htmlText = htmlText.replace(`{${index}}`, displayHtml);
            });

            document.getElementById('text-window').innerHTML = htmlText;
            updateScore();
        }

        function openGapModal(index) {
            activeGapIndex = index;
            const data = textsDatabase[currentTextKey];
            const gap = data.gaps[index];
            const correctWord = gap.choices[0]; 

            const shuffledChoices = [...gap.choices].sort(() => Math.random() - 0.5);

            const listContainer = document.getElementById('modal-choices-list');
            listContainer.innerHTML = '';

            shuffledChoices.forEach(choice => {
                const isCorrect = (choice === correctWord);
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-50 hover:bg-indigo-50 hover:border-indigo-400 border border-slate-200 text-slate-800 font-medium py-2.5 px-3.5 rounded-xl text-xs sm:text-sm transition-all shadow-xs cursor-pointer";
                btn.innerText = choice;
                btn.onclick = () => selectChoice(choice, isCorrect, gap.explanation);
                listContainer.appendChild(btn);
            });

            document.getElementById('gap-modal-container').classList.remove('hidden');
        }

        function selectChoice(text, isCorrect, explanation) {
            if (activeGapIndex !== null) {
                gapStates[activeGapIndex] = { text: text, correct: isCorrect };
            }
            closeModal();
            renderExercise();

            // Si c'est une erreur, afficher la modale d'explication
            if (!isCorrect && explanation) {
                document.getElementById('error-explanation-text').innerText = explanation;
                document.getElementById('error-modal-container').classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('gap-modal-container').classList.add('hidden');
            activeGapIndex = null;
        }

        function closeErrorModal() {
            document.getElementById('error-modal-container').classList.add('hidden');
        }

        function updateScore() {
            const data = textsDatabase[currentTextKey];
            const total = data.gaps.length;
            let correctCount = 0;
            
            Object.keys(gapStates).forEach(idx => {
                if (gapStates[idx].correct) correctCount++;
            });

            const indicator = document.getElementById('score-indicator');
            if (correctCount === total) {
                indicator.innerText = "🎉 Excellent ! Tout est correct !";
                indicator.className = "font-bold text-emerald-600";
            } else {
                indicator.innerText = `Progrès : ${correctCount} / ${total} résolus`;
                indicator.className = "font-bold text-indigo-900";
            }
        }

        function resetExercise() {
            gapStates = {};
            renderExercise();
        }

        window.onload = () => {
            renderExercise();
        };
    </script>
</body>
</html>
