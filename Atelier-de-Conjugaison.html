<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier de Conjugaison — A2 FLE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --ink: #0f172a;
    --ink-soft: #64748b;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --accent: #d9622b;
    --good: #10b981;
    --good-bg: rgba(16, 185, 129, 0.12);
    --bad: #ef4444;
    --bad-bg: rgba(239, 68, 68, 0.12);
    --ring: #e2e8f0;
    --tag-bg: #f1f5f9;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a;
      --card: #1e293b;
      --ink: #f8fafc;
      --ink-soft: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #f08a4b;
      --good: #34d399;
      --good-bg: rgba(52, 211, 153, 0.15);
      --bad: #f87171;
      --bad-bg: rgba(248, 113, 113, 0.15);
      --ring: #334155;
      --tag-bg: #334155;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    padding: 24px 16px;
    line-height: 1.5;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    color: var(--ink);
    text-decoration: none;
    border: 1px solid var(--ring);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }
  .nav-btn:hover { background: var(--tag-bg); color: var(--primary); }

  header {
    text-align: center;
    background: var(--card);
    padding: 24px 20px;
    border-radius: 20px;
    border: 1px solid var(--ring);
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
  }

  h1 { font-size: clamp(22px, 5vw, 28px); font-weight: 800; margin: 0 0 6px; }
  .subtitle { color: var(--ink-soft); font-size: 14px; margin: 0; }

  .config-panel {
    background: var(--card);
    border: 1px solid var(--ring);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
  }

  .config-title {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .config-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin-bottom: 14px;
  }
  .config-group:last-child { margin-bottom: 0; }

  .checkbox-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }

  .checkbox-label input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--primary);
    cursor: pointer;
  }

  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .pill {
    background: var(--card);
    border: 1px solid var(--ring);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: var(--shadow-sm);
  }
  .pill.score { color: var(--good); }

  .game-container {
    background: var(--card);
    border: 1px solid var(--ring);
    border-radius: 20px;
    padding: 24px 16px;
    box-shadow: var(--shadow-md);
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
  }

  .draw-card {
    background: var(--tag-bg);
    border: 2px solid var(--ring);
    border-radius: 16px;
    padding: 16px;
    text-align: center;
  }

  .draw-card h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }

  .badge-display {
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 800;
    background: var(--card);
    border-radius: 10px;
    border: 1px solid var(--ring);
    color: var(--primary);
    padding: 6px 10px;
    margin-bottom: 10px;
  }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    transition: transform 0.1s ease, opacity 0.2s ease, background 0.2s ease;
  }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  .draw-btn { width: 100%; color: #fff; }
  .btn-time { background: #3f9b7a; }
  .btn-subj { background: #d9622b; }
  .btn-verb { background: #4a7fb5; }

  .action-center { text-align: center; margin-top: 10px; }

  .generate-all-btn {
    background: var(--primary);
    color: #fff;
    font-size: 16px;
    padding: 12px 24px;
    border-radius: 12px;
    width: 100%;
    max-width: 320px;
  }

  .answer-card {
    background: var(--tag-bg);
    border: 1px solid var(--ring);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    display: none;
    margin-top: 20px;
  }
  .answer-card.show { display: block; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .prompt-phrase {
    font-size: 16px;
    margin: 0 0 16px;
    line-height: 1.6;
  }
  .prompt-phrase b { color: var(--primary); }

  .sentence-builder {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    background: var(--card);
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid var(--ring);
    margin-bottom: 16px;
    font-size: 17px;
    font-weight: 600;
    text-align: left;
  }

  .fixed-prefix { color: var(--ink); font-weight: 600; }

  .sentence-builder input[type="text"] {
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 8px;
    border: 2px solid var(--primary);
    background: var(--tag-bg);
    color: var(--primary);
    width: 190px;
    outline: none;
  }
  .sentence-builder input[type="text"].shake {
    animation: shake 0.4s;
    border-color: var(--bad);
    color: var(--bad);
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
