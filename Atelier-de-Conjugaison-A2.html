<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>L'Atelier du Français — FLE A2</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-bubble {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Style de défilement discret */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-2 sm:p-6 font-sans">

    <!-- En-tête principal -->
    <header class="w-full max-w-4xl mb-3 flex items-center justify-between px-1">
        <!-- Bouton de retour vers la liste des exercices -->
        <a href="https://tainacluzeau-del.github.io/Exercices/" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-700 hover:text-indigo-700 bg-white hover:bg-indigo-50 px-3 py-2 rounded-xl transition shadow-sm border border-slate-200">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-indigo-600">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
            <span class="hidden sm:inline">Retour aux exercices</span>
            <span class="sm:hidden">Accueil</span>
        </a>

        <!-- Titre centré -->
        <div class="text-right sm:text-center flex-1 ml-2">
            <h1 class="text-base sm:text-2xl font-bold text-indigo-700">L'Atelier du Français — A2</h1>
            <p class="text-slate-600 text-[11px] sm:text-xs">Dialogues guidés & Récits (4 choix - Règle A2)</p>
        </div>
    </header>

    <!-- Conteneur principal séparé en 2 colonnes sur écran large -->
    <main class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row h-[85vh] max-h-[750px] border border-slate-200">
        
        <!-- PANNEAU GAUCHE : Fiche profil & sélection du personnage -->
        <aside class="w-full md:w-80 bg-indigo-50/60 border-b md:border-b-0 md:border-r border-indigo-100 p-3 md:p-4 flex flex-col shrink-0">
            <!-- Choix du dialogue -->
            <label for="dialogue-selector" class="text-xs font-semibold text-indigo-900 uppercase tracking-wider mb-1.5 block">
                Sélectionner un profil (A2)
            </label>
            <select id="dialogue-selector" onchange="changeDialogue(this.value)" class="bg-white text-indigo-950 text-xs sm:text-sm font-medium rounded-lg p-2.5 outline-none border border-indigo-200 cursor-pointer w-full mb-2 sm:mb-3 shadow-sm focus:ring-2 focus:ring-indigo-500">
                <option value="chloe" selected>Unité 1 : Chloé (Le week-end dernier)</option>
                <option value="antoine">Unité 2 : Antoine (Projets de déménagement)</option>
                <option value="sarah">Unité 3 : Sarah (Chez le médecin)</option>
            </select>

            <!-- Bouton accordéon mobile pour basculer le profil -->
            <button onclick="toggleProfile()" class="md:hidden w-full flex items-center justify-between bg-white border border-indigo-200 text-indigo-950 px-3 py-2 rounded-xl text-xs font-semibold shadow-sm mb-2 active:scale-[0.99] transition">
                <span id="profile-toggle-label" class="flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-indigo-600">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>
                    Fiche profil : <span id="character-name-mobile" class="font-bold">...</span>
                </span>
                
                <svg id="profile-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-indigo-600 transition-transform duration-300">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                </svg>
            </button>

            <!-- Fiche profil détaillée -->
            <div id="profile-container" class="hidden md:flex bg-white rounded-xl p-3.5 border border-indigo-100 shadow-sm flex-1 overflow-y-auto flex-col">
                <div class="flex items-center gap-2 mb-2 pb-2 border-b border-slate-100">
                    <span id="unit-tag" class="text-[10px] uppercase tracking-wider bg-indigo-100 text-indigo-800 px-2.5 py-0.5 rounded-full font-bold">Unité 1</span>
                </div>
                <h2 id="character-name" class="text-base font-bold text-indigo-950 mb-2">...</h2>
                <div id="profile-card" class="text-xs sm:text-sm text-slate-600 leading-relaxed space-y-1.5">
                    <!-- Contenu du profil injecté en JS -->
                </div>
            </div>
        </aside>

        <!-- PANNEAU DROIT : Fenêtre de discussion -->
        <section class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 relative">
            
            <!-- Barre supérieure avec bouton Recommencer -->
            <div class="p-2.5 sm:p-3 bg-white border-b border-slate-200 flex items-center justify-between shrink-0">
                <button onclick="resetExercise()" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition border border-indigo-200">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 016 6v3" />
                    </svg>
                    <span>Recommencer l'exercice</span>
                </button>
                <span class="text-xs font-medium text-slate-500" id="step-indicator">Étape 1</span>
            </div>

            <!-- Zone des messages du chat -->
            <div id="chat-window" class="flex-1 p-3 sm:p-4 overflow-y-auto space-y-3">
                <!-- Les messages du dialogue s'affichent ici -->
            </div>

            <!-- Boîte de Feedback pédagogique -->
            <div id="feedback-box" class="hidden p-3 mx-3 sm:mx-4 my-2 rounded-xl border text-xs sm:text-sm transition-all duration-300 shadow-sm">
                <!-- Correction explicative -->
            </div>

            <!-- Zone des propositions de réponses (4 options) -->
            <div id="options-container" class="p-2.5 sm:p-4 border-t border-slate-200 bg-white flex flex-col gap-2 shrink-0 overflow-y-auto max-h-[48%]">
                <!-- Boutons générés dynamiquement -->
            </div>
        </section>

    </main>

    <script>
        // --- DONNÉES DES DIALOGUES FLE A2 (4 OPTIONS EXIGEANTES) ---
        const dialogues = {
            chloe: {
                unit: "Unité 1 — Raconter son week-end",
                title: "Chloé Durand (Femme)",
                profile: `
                    <p><b>Âge :</b> 26 ans</p>
                    <p><b>Genre :</b> Féminin (Chloé)</p>
                    <p><b>Destination :</b> Marseille (en TGV)</p>
                    <hr class="my-1 border-indigo-100">
                    <p><b>Activités :</b> Visite du Vieux-Port, dégustation d'une bouillabaisse, promenade au bord de la mer.</p>
                    <p><b>Logement :</b> Chez son amie Sarah.</p>
                `,
                steps: [
                    {
                        interlocutor: "Salut Chloé ! Alors, comment s'est passé ton week-end ?",
                        options: [
                            { text: "C'était super ! Je suis allée à Marseille pour visiter la ville.", correct: true, feedback: "🥇 Bravo ! Accord exact du participe passé ('allée' avec -e car Chloé est une femme) et bon auxiliaire 'être'." },
                            { text: "C'était super ! Je suis allé à Marseille pour visiter la ville.", correct: false, feedback: "⚠️ Attention à l'accord ! Chloé est une femme : au passé composé avec l'auxiliaire être, on ajoute un '-e' (je suis allée)." },
                            { text: "C'était super ! J'ai allée à Marseille pour visiter la ville.", correct: false, feedback: "⚠️ Le verbe 'aller' se conjugue avec l'auxiliaire 'être' (je suis allée), pas avec 'avoir'." },
                            { text: "C'était super ! Je suis aller à Marseille pour visiter la ville.", correct: false, feedback: "⚠️ Après l'auxiliaire 'être', le verbe s'écrit au participe passé ('allée'), pas à l'infinitif ('aller')." }
                        ]
                    },
                    {
                        interlocutor: "Génial ! Et qu'est-ce que tu as fait samedi soir ?",
                        options: [
                            { text: "J'ai mangé une spécialité et j'ai pris des photos du port.", correct: true, feedback: "🥇 Parfait ! Bon choix des participes passés (mangé / pris) avec l'auxiliaire avoir." },
                            { text: "J'ai mangée une spécialité et j'ai pris des photos du port.", correct: false, feedback: "⚠️ Avec l'auxiliaire 'avoir', le participe passé ne s'accorde pas avec le sujet (Chloé) quand le COD est après le verbe (j'ai mangé)." },
                            { text: "Je suis mangé une spécialité et j'ai prenez des photos du port.", correct: false, feedback: "⚠️ Le verbe 'manger' s'utilise avec 'avoir' (j'ai mangé), et le participe passé de 'prendre' est 'pris'." },
                            { text: "J'ai manger une spécialité et j'ai pris des photos du port.", correct: false, feedback: "⚠️ Au passé composé, on utilise le participe passé en '-é' (mangé) et non l'infinitif en '-er' (manger)." }
                        ]
                    },
                    {
                        interlocutor: "Tu as dormi à l'hôtel ?",
                        options: [
                            { text: "Non, je n'ai pas pris d'hôtel, j'ai dormi chez une amie.", correct: true, feedback: "🥇 Excellent ! Négation correcte (n'ai pas pris) et bon usage du partitif 'd'hôtel'." },
                            { text: "Non, je n'ai pas prends d'hôtel, j'ai dormi chez une amie.", correct: false, feedback: "⚠️ Après l'auxiliaire 'avoir' dans la négation, il faut utiliser le participe passé 'pris' (et pas le présent 'prends')." },
                            { text: "Non, je ne ai pas pris un hôtel, je suis dormi chez une amie.", correct: false, feedback: "⚠️ N'oublie pas l'élision (je n'ai pas) et le verbe 'dormir' prend l'auxiliaire 'avoir' (j'ai dormi)." },
                            { text: "Non, je n'ai pas pris de l'hôtel, j'ai dormi chez une amie.", correct: false, feedback: "⚠️ Dans une phrase négative, l'article indéfini devient 'de' ou 'd'' devant une voyelle (pas d'hôtel)." }
                        ]
                    }
                ]
            },
            antoine: {
                unit: "Unité 2 — Projets & Déménagement",
                title: "Antoine Mercier",
                profile: `
                    <p><b>Âge :</b> 30 ans</p>
                    <p><b>Ville actuelle :</b> Paris</p>
                    <p><b>Projets :</b> Déménager à Lyon le mois prochain, louer un appartement, acheter un vélo.</p>
                `,
                steps: [
                    {
                        interlocutor: "Salut Antoine ! Tu vas bientôt changer de ville ?",
                        options: [
                            { text: "Oui, le mois prochain, je vais déménager à Lyon.", correct: true, feedback: "🥇 Parfait ! Structure exacte du futur proche (aller + infinitif) et bonne préposition de ville ('à Lyon')." },
                            { text: "Oui, le mois prochain, je vais déménagé à Lyon.", correct: false, feedback: "⚠️ Au futur proche, le deuxième verbe reste à l'infinitif (déménager, -er)." },
                            { text: "Oui, le mois prochain, je vais déménager en Lyon.", correct: false, feedback: "⚠️ On utilise la préposition 'à' devant les noms de villes (à Lyon, à Paris), pas 'en'." },
                            { text: "Oui, le mois prochain, je suis allé déménager à Lyon.", correct: false, feedback: "⚠️ 'Le mois prochain' indique une action future. Il faut utiliser le futur proche (je vais déménager), pas le passé." }
                        ]
                    },
                    {
                        interlocutor: "Comment tu te prépares pour trouver ton appartement ?",
                        options: [
                            { text: "Je vais contacter deux agences pour visiter des logements la semaine prochaine.", correct: true, feedback: "🥇 Bravo ! Les deux infinitifs ('contacter', 'visiter') sont bien construits." },
                            { text: "Je vais contacter deux agences pour visite des logements la semaine prochaine.", correct: false, feedback: "⚠️ Après la préposition 'pour', le verbe doit être à l'infinitif (pour visiter)." },
                            { text: "Je vais contacte deux agences pour visiter des logements la semaine prochaine.", correct: false, feedback: "⚠️ Dans la structure du futur proche, le verbe principal s'écrit à l'infinitif (je vais contacter)." },
                            { text: "J'ai contacté deux agences pour visiter des logements la semaine prochaine.", correct: false, feedback: "⚠️ Incohérence temporelle : 'la semaine prochaine' demande un temps du futur (je vais contacter)." }
                        ]
                    }
                ]
            },
            sarah: {
                unit: "Unité 3 — Santé & Rendez-vous médical",
                title: "Sarah Benali",
                profile: `
                    <p><b>Symptômes :</b> Mal à la tête, fièvre depuis hier, fatigue.</p>
                    <p><b>Besoin :</b> Un médicament et un arrêt de travail d'un jour.</p>
                `,
                steps: [
                    {
                        interlocutor: "Bonjour Madame. Dites-moi, qu'est-ce qui ne va pas aujourd'hui ?",
                        options: [
                            { text: "Bonjour Docteur, j'ai mal à la tête et j'ai de la fièvre depuis hier.", correct: true, feedback: "🥇 Excellent ! Expression exacte de la douleur (mal à la tête) et de l'article partitif (de la fièvre)." },
                            { text: "Bonjour Docteur, j'ai mal au tête et j'ai de la fièvre depuis hier.", correct: false, feedback: "⚠️ 'Tête' est un nom féminin. On dit 'mal à la tête' (et non 'au tête', réservé au masculin comme 'au ventre')." },
                            { text: "Bonjour Docteur, je suis mal à la tête et j'ai du fièvre depuis hier.", correct: false, feedback: "⚠️ On utilise le verbe 'avoir' pour la douleur (j'ai mal) et 'fièvre' est féminin (de la fièvre)." },
                            { text: "Bonjour Docteur, j'ai mal de la tête et j'ai de fièvre depuis hier.", correct: false, feedback: "⚠️ La structure de la douleur est 'avoir mal à + article' (à la tête), et il faut l'article partitif 'de la' devant fièvre." }
                        ]
                    },
                    {
                        interlocutor: "D'accord. Vous prenez des médicaments actuellement ?",
                        options: [
                            { text: "Non, je n'ai rien pris parce que je voulais votre avis.", correct: true, feedback: "🥇 Très bien ! Emploi judicieux de la négation 'ne... rien' et de l'imparfait de justification ('je voulais')." },
                            { text: "Non, je n'ai pas pris rien parce que je voulais votre avis.", correct: false, feedback: "⚠️ On ne double pas la négation : on dit 'je n'ai rien pris' (et pas 'ne... pas rien')." },
                            { text: "Non, je n'ai rien prendre parce que je veux votre avis.", correct: false, feedback: "⚠️ Au passé composé avec la négation 'rien', le verbe doit être au participe passé ('rien pris')." },
                            { text: "Non, je ne rien ai pris parce que je voulais votre avis.", correct: false, feedback: "⚠️ Ordre des mots incorrect : 'rien' se place entre l'auxiliaire et le participe passé (n'ai rien pris)." }
                        ]
                    }
                ]
            }
        };

        // --- ÉTAT ET LOGIQUE DE L'APPLICATION ---
        let currentDialogueKey = "chloe";
        let currentStepIndex = 0;

        function changeDialogue(key) {
            currentDialogueKey = key;
            resetExercise();
        }

        function resetExercise() {
            currentStepIndex = 0;
            initDialogue();
        }

        function toggleProfile() {
            const container = document.getElementById('profile-container');
            const chevron = document.getElementById('profile-chevron');
            container.classList.toggle('hidden');
            container.classList.toggle('flex');
            chevron.classList.toggle('rotate-180');
        }

        function scrollToBottom() {
            const chatWindow = document.getElementById('chat-window');
            const lastChild = chatWindow.lastElementChild;
            if (lastChild) {
                setTimeout(() => {
                    lastChild.scrollIntoView({ behavior: 'smooth', block: 'end' });
                }, 100);
            }
        }

        function initDialogue() {
            const data = dialogues[currentDialogueKey];
            
            document.getElementById('unit-tag').innerText = data.unit;
            document.getElementById('character-name').innerText = data.title;
            document.getElementById('character-name-mobile').innerText = data.title;
            document.getElementById('profile-card').innerHTML = data.profile;
            
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '';
            
            hideFeedback();
            renderStep();
        }

        function renderStep() {
            const data = dialogues[currentDialogueKey];
            const indicator = document.getElementById('step-indicator');
            
            if (currentStepIndex < data.steps.length) {
                indicator.innerText = `Étape ${currentStepIndex + 1} / ${data.steps.length}`;
            } else {
                indicator.innerText = "Terminé";
            }

            if (currentStepIndex >= data.steps.length) {
                appendInterlocutorMessage("Bravo ! Vous avez terminé cet exercice de niveau A2 avec un sans-faute grammatical ! 🎉");
                document.getElementById('options-container').innerHTML = `
                    <button onclick="resetExercise()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-md active:scale-[0.99]">
                        Recommencer ce dialogue
                    </button>
                `;
                return;
            }

            const currentStep = data.steps[currentStepIndex];
            
            appendInterlocutorMessage(currentStep.interlocutor);

            // Mélange aléatoire des 4 options
            const shuffledOptions = [...currentStep.options].sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-50 hover:bg-indigo-50 hover:border-indigo-400 border border-slate-200 text-slate-800 font-medium py-2 px-3 rounded-xl text-xs sm:text-sm transition-all shadow-sm active:scale-[0.99]";
                btn.innerText = opt.text;
                btn.onclick = () => handleChoice(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function handleChoice(option) {
            showFeedback(option.feedback, option.correct);

            if (option.correct) {
                appendUserMessage(option.text);
                document.getElementById('options-container').innerHTML = '';
                
                setTimeout(() => {
                    hideFeedback();
                    currentStepIndex++;
                    renderStep();
                }, 2200);
            }
        }

        function appendInterlocutorMessage(text) {
            const chatWindow = document.getElementById('chat-window');
            const msgHtml = `
                <div class="flex items-start gap-2 chat-bubble">
                    <div class="w-7 h-7 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shrink-0 mt-0.5 shadow-sm">
                        💬
                    </div>
                    <div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-tl-none p-3 max-w-[85%] text-xs sm:text-sm shadow-sm leading-relaxed">
                        ${text}
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
        }

        function appendUserMessage(text) {
            const chatWindow = document.getElementById('chat-window');
            const msgHtml = `
                <div class="flex items-start gap-2 justify-end chat-bubble">
                    <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none p-3 max-w-[85%] text-xs sm:text-sm shadow-sm leading-relaxed">
                        ${text}
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
        }

        function showFeedback(message, isCorrect) {
            const box = document.getElementById('feedback-box');
            box.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-300', 'text-emerald-900', 'bg-amber-50', 'border-amber-300', 'text-amber-900');
            
            if (isCorrect) {
                box.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
            } else {
                box.classList.add('bg-amber-50', 'border-amber-300', 'text-amber-900');
            }

            box.innerHTML = message;
        }

        function hideFeedback() {
            const box = document.getElementById('feedback-box');
            box.classList.add('hidden');
        }

        // --- INITIALISATION ---
        window.onload = () => {
            initDialogue();
        };
    </script>
</body>
</html>
