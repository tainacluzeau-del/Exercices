<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Atelier du Français — FLE A1</title>
    <!-- Tailwind CSS pour un design moderne et adaptatif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animation fluide de l'apparition des bulles de chat */
        .chat-bubble {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-3 sm:p-6">

    <!-- En-tête principal -->
    <header class="w-full max-w-xl mb-4 text-center">
        <h1 class="text-2xl sm:text-3xl font-bold text-indigo-700">L'Atelier du Français — A1</h1>
        <p class="text-slate-600 text-xs sm:text-sm mt-1">Application interactive de dialogues guidés</p>
    </header>

    <!-- Conteneur style Application de Messagerie (WhatsApp) -->
    <main class="w-full max-w-xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[85vh] max-h-[750px] border border-slate-200">
        
        <!-- En-tête de la messagerie -->
        <div class="bg-indigo-600 text-white p-3 sm:p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-indigo-700">
            <div>
                <span id="unit-tag" class="text-[10px] uppercase tracking-wider bg-indigo-800 px-2 py-0.5 rounded-full font-semibold">Unité 1</span>
                <h2 id="character-name" class="text-lg font-bold mt-0.5">...</h2>
            </div>
            
            <select id="dialogue-selector" onchange="changeDialogue(this.value)" class="bg-indigo-700 text-white text-xs sm:text-sm font-medium rounded-lg px-2.5 py-1.5 outline-none border border-indigo-500 cursor-pointer w-full sm:w-auto">
                <option value="lucas" selected>Unité 1 : Lucas (La famille)</option>
                <option value="elodie">Unité 1 : Élodie (La famille)</option>
                <option value="thomas">Unité 2 : Thomas (Le week-end)</option>
            </select>
        </div>

        <!-- Fiche profil du personnage -->
        <div id="profile-card" class="bg-indigo-50 border-b border-indigo-100 p-3 text-xs sm:text-sm text-indigo-950">
            <!-- Rempli dynamiquement en JS -->
        </div>

        <!-- Fenêtre de Chat / Discussion -->
        <div id="chat-window" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50">
            <!-- Les messages s'affichent ici -->
        </div>

        <!-- Boîte de Feedback pédagogique -->
        <div id="feedback-box" class="hidden p-3 mx-4 my-2 rounded-xl border text-xs sm:text-sm transition-all duration-300">
            <!-- Message de correction -->
        </div>

        <!-- Zone des options de réponses -->
        <div id="options-container" class="p-3 sm:p-4 border-t border-slate-200 bg-white flex flex-col gap-2 shrink-0">
            <!-- Boutons choisis par l'apprenant -->
        </div>
    </main>

    <script>
        // --- DONNÉES DES DIALOGUES COMPLETES ---
        const dialogues = {
            lucas: {
                unit: "Unité 1 — Intro & Famille",
                title: "Lucas Moreau",
                profile: "<b>Âge :</b> 28 ans | <b>Ville :</b> Paris | <b>Profession :</b> Architecte<br><b>Famille :</b> Marié, 2 enfants (fils 6 ans, fille 3 ans), 1 sœur. Parents à Montréal.",
                steps: [
                    {
                        interlocutor: "Bonjour ! Comment vous vous appelez ?",
                        options: [
                            { text: "Je m'appelle Lucas Moreau.", correct: true, feedback: "🥇 Parfait ! Présentation simple et exacte avec le verbe pronominal 's'appeler'." },
                            { text: "Je suis Lucas Moreau.", correct: false, feedback: "⚠️ En français, on utilise habituellement le verbe 's'appeler' pour donner son prénom et son nom." },
                            { text: "Mon nom est Lucas Moreau.", correct: false, feedback: "💡 C'est compréhensible, mais 'Je m'appelle' est la formule la plus naturelle et courante au niveau A1." }
                        ]
                    },
                    {
                        interlocutor: "Enchanté Lucas ! Vous êtes marié ?",
                        options: [
                            { text: "Oui, je suis marié et j'ai deux enfants.", correct: true, feedback: "🥇 Excellent ! Distinction parfaite entre l'état civil (être marié) et la possession (avoir des enfants)." },
                            { text: "Oui, j'ai marié et je suis deux enfants.", correct: false, feedback: "⚠️ Attention à ne pas confondre les auxiliaires : 'je suis marié' (état) et 'j'ai deux enfants' (possession)." },
                            { text: "Oui, je suis célibataire.", correct: false, feedback: "💡 Regardez bien la fiche profil de Lucas : il est marié !" }
                        ]
                    },
                    {
                        interlocutor: "Quels âges ont vos enfants ?",
                        options: [
                            { text: "Mon fils a 6 ans et ma fille a 3 ans.", correct: true, feedback: "🥇 Bravo ! Les adjectifs possessifs (mon/ma) et le verbe avoir sont parfaitement maîtrisés." },
                            { text: "Mon fils est 6 ans et ma fille est 3 ans.", correct: false, feedback: "⚠️ En français, on utilise toujours le verbe 'avoir' pour indiquer l'âge (il a 6 ans)." },
                            { text: "Ma fils a 6 ans et mon fille a 3 ans.", correct: false, feedback: "⚠️ Attention au genre des noms : 'fils' est masculin (mon fils) et 'fille' est féminin (ma fille)." }
                        ]
                    },
                    {
                        interlocutor: "Et vous avez des frères et sœurs ?",
                        options: [
                            { text: "Oui, j'ai une sœur.", correct: true, feedback: "🥇 Très bien ! Utilisation exacte de l'article indéfini féminin 'une'." },
                            { text: "Oui, j'ai un sœur.", correct: false, feedback: "⚠️ Attention au genre : 'sœur' est un nom féminin (une sœur)." },
                            { text: "Oui, je suis une sœur.", correct: false, feedback: "⚠️ Mauvais verbe ! On dit 'j'ai une sœur' (verbe avoir) et non 'je suis'." }
                        ]
                    },
                    {
                        interlocutor: "Où habitent vos parents ?",
                        options: [
                            { text: "Mes parents habitent à Montréal.", correct: true, feedback: "🥇 Parfait ! Accord du possessif au pluriel (mes) et conjugaison exacte du verbe habiter (ils habitent)." },
                            { text: "Mon parents habite à Montréal.", correct: false, feedback: "⚠️ 'Parents' est au pluriel : il faut utiliser le possessif 'mes' et accorder le verbe (habitent)." },
                            { text: "Mes parents habitent en Montréal.", correct: false, feedback: "⚠️ Devant une ville, on utilise la préposition 'à' (à Montréal), pas 'en'." }
                        ]
                    }
                ]
            },
            elodie: {
                unit: "Unité 1 — Extension Famille",
                title: "Élodie Bertrand",
                profile: "<b>Âge :</b> 34 ans | <b>Ville :</b> Bruxelles | <b>Profession :</b> Graphiste<br><b>Famille :</b> Célibataire, 0 enfant, 1 chien (Toby), 2 frères (Julien et Thomas). Parents à Liège.",
                steps: [
                    {
                        interlocutor: "Bonjour Élodie ! Dites-moi, vous êtes mariée ? Vous avez des enfants ?",
                        options: [
                            { text: "Non, je suis célibataire. Je n'ai pas d'enfant, mais j'ai un chien !", correct: true, feedback: "🥇 Parfait ! Utilisation exacte du statut, de la négation 'ne... pas de' et du verbe avoir." },
                            { text: "Non, je suis célibataire. Je suis un chien.", correct: false, feedback: "⚠️ Attention au verbe ! On utilise avoir (j'ai un chien), pas le verbe être." },
                            { text: "Oui, je suis mariée et j'ai deux enfants.", correct: false, feedback: "💡 Regardez la fiche d'Élodie : elle est célibataire et n'a pas d'enfant !" }
                        ]
                    },
                    {
                        interlocutor: "Ah un chien ! Comment il s'appelle ? Il a quel âge ?",
                        options: [
                            { text: "Il s'appelle Toby et il a 4 ans.", correct: true, feedback: "🥇 Excellent ! Bonne conjugaison du verbe avoir à la 3ᵉ personne (il a)." },
                            { text: "Il s'appelle Toby et il est 4 ans.", correct: false, feedback: "⚠️ En français, on utilise le verbe avoir pour donner l'âge (il a 4 ans)." },
                            { text: "Il s'appelle Toby et il ont 4 ans.", correct: false, feedback: "⚠️ 'Ont' est réservé au pluriel (ils ont). Pour un seul chien, on utilise 'a' (il a)." }
                        ]
                    },
                    {
                        interlocutor: "D'accord ! Et vous avez des frères et sœurs ?",
                        options: [
                            { text: "Oui, j'ai deux frères : Julien et Thomas.", correct: true, feedback: "🥇 Bravo ! Vocabulaire de la famille et verbe avoir (j'ai) parfaitement employés." },
                            { text: "Oui, j'ai deux sœurs : Julien et Thomas.", correct: false, feedback: "💡 Julien et Thomas sont des prénoms masculins : ce sont ses frères !" },
                            { text: "Oui, j'est deux frères : Julien et Thomas.", correct: false, feedback: "⚠️ Attention à l'orthographe : avec 'je', le verbe avoir s'écrit 'j'ai'." }
                        ]
                    },
                    {
                        interlocutor: "Qu'est-ce qu'ils font dans la vie ? Ils ont quel âge ?",
                        options: [
                            { text: "Ils ont 30 ans et 26 ans. Ils sont étudiants.", correct: true, feedback: "🥇 Parfait ! Distinction exacte entre le verbe avoir au pluriel (ils ont) et le verbe être (ils sont)." },
                            { text: "Ils a 30 ans et 26 ans.", correct: false, feedback: "⚠️ Avec le sujet 'ils' (pluriel), le verbe avoir devient 'ont' (ils ont)." },
                            { text: "Ils sont 30 ans et 26 ans.", correct: false, feedback: "⚠️ Ne confondez pas être (ils sont) et avoir (ils ont pour l'âge)." }
                        ]
                    },
                    {
                        interlocutor: "C'est une très jolie famille ! Et vos parents, ils habitent à Bruxelles aussi ?",
                        options: [
                            { text: "Non, ils habitent à Liège. Et vous, vous avez des frères et sœurs ?", correct: true, feedback: "🥇 Bravo ! Relance parfaite et respect des règles de politesse (vouvoiement)." },
                            { text: "Non, ils habitent à Liège. Et toi, tu as des frères et sœurs ?", correct: false, feedback: "⚠️ L'interlocuteur vous vouvoie ('vos parents'), il faut maintenir le vouvoiement ('vous')." },
                            { text: "Non, il habite à Liège. Et vous, vous avez des frères et sœurs ?", correct: false, feedback: "⚠️ 'Les parents' est un nom au pluriel, il faut utiliser le pronom 'ils' (ils habitent)." }
                        ]
                    }
                ]
            },
            thomas: {
                unit: "Unité 2 — On fait quoi ce week-end ?",
                title: "Thomas Blanc",
                profile: "<b>Ville :</b> Lyon | <b>Aime :</b> Le sport, le cinéma, la musique | <b>N'aime pas :</b> Le théâtre<br><b>Programme :</b> Aujourd'hui : sport le matin, ne travaille pas l'après-midi. Demain : film ou musique.",
                steps: [
                    {
                        interlocutor: "Salut Thomas ! Qu'est-ce que tu fais aujourd'hui pour le week-end ?",
                        options: [
                            { text: "Je fais du sport le matin, et l'après-midi je ne travaille pas.", correct: true, feedback: "🥇 Parfait ! Utilisation exacte du verbe faire et de la structure négative complete (ne... pas)." },
                            { text: "Je fais du sport le matin, et l'après-midi je ne travaille.", correct: false, feedback: "⚠️️ La négation est incomplète : il manque le deuxième élément 'pas' (je ne travaille pas)." },
                            { text: "Je fais le sport et je travaille pas.", correct: false, feedback: "⚠️ On utilise l'article partitif/contracté avec le verbe faire : 'faire du sport'." }
                        ]
                    },
                    {
                        interlocutor: "Super ! Est-ce que tu aimes le cinéma ou le théâtre ?",
                        options: [
                            { text: "J'aime le cinéma, mais je n'aime pas le théâtre.", correct: true, feedback: "🥇 Excellent ! On utilise l'article défini (le) avec les verbes d'appréciation comme 'aimer'." },
                            { text: "J'aime un cinéma, mais je n'aime pas le théâtre.", correct: false, feedback: "⚠️ Pour exprimer un goût général, on utilise l'article défini 'le' et non l'article indéfini 'un'." },
                            { text: "J'aime le cinéma, mais je ne aime pas le théâtre.", correct: false, feedback: "⚠️ Attention à l'élision : devant la voyelle 'a', 'ne' devient 'n'' (je n'aime pas)." }
                        ]
                    },
                    {
                        interlocutor: "Ah moi aussi j'adore le cinéma ! Alors, est-ce que tu regardes un film ce week-end ?",
                        options: [
                            { text: "Oui, je regarde un film samedi ou dimanche.", correct: true, feedback: "🥇 Parfait ! Bonne terminaison du verbe en -er au présent (je regarde) et emploi du choix 'ou'." },
                            { text: "Oui, je regardes un film samedi ou dimanche.", correct: false, feedback: "⚠️ Attention à la terminaison : avec le pronom 'je', les verbes en -er prennent un '-e'." },
                            { text: "Oui, je regarde un film, alors je n'aime pas le cinéma.", correct: false, feedback: "💡 Incohérence logique : 'alors' introduit une conséquence en contradiction avec la suite !" }
                        ]
                    },
                    {
                        interlocutor: "Demain après-midi, c'est parfait ! Tu es libre ?",
                        options: [
                            { text: "Oui ! Demain je ne travaille pas, mais maintenant je travaille.", correct: true, feedback: "🥇 Excellent ! Distinction temporelle nette entre 'demain' et 'maintenant'." },
                            { text: "Oui ! Aujourd'hui je ne travaille pas demain.", correct: false, feedback: "⚠️ Attention : vous ne pouvez pas associer 'aujourd'hui' et 'demain' dans la même proposition." },
                            { text: "Oui ! Aujourd'hui je ne travaille pas.", correct: false, feedback: "⚠️ L'interlocuteur demande votre disponibilité pour 'demain', pas pour aujourd'hui." }
                        ]
                    },
                    {
                        interlocutor: "D'accord ! Et maintenant, qu'est-ce que tu fais ?",
                        options: [
                            { text: "Maintenant, j'écoute de la musique. Est-ce que tu écoutes de la musique aussi ?", correct: true, feedback: "🥇 Bravo ! Présent de l'indicatif avec 'maintenant' et interrogation correcte avec 'Est-ce que'." },
                            { text: "Maintenant, je écoute de la musique. Est-ce que tu écoutes de la musique aussi ?", correct: false, feedback: "⚠️ Élision obligatoire : 'je' devant une voyelle se transforme en 'j'' (j'écoute)." },
                            { text: "Maintenant, j'écoutais de la musique. Écoutes-tu de la musique aussi ?", correct: false, feedback: "⚠️ L'adverbe 'maintenant' exige le présent (j'écoute) et non l'imparfait (j'écoutais)." }
                        ]
                    }
                ]
            }
        };

        // --- ÉTAT ET LOGIQUE D'APPLICATION ---
        let currentDialogueKey = "lucas";
        let currentStepIndex = 0;

        function changeDialogue(key) {
            currentDialogueKey = key;
            currentStepIndex = 0;
            initDialogue();
        }

        function initDialogue() {
            const data = dialogues[currentDialogueKey];
            
            document.getElementById('unit-tag').innerText = data.unit;
            document.getElementById('character-name').innerText = data.title;
            document.getElementById('profile-card').innerHTML = data.profile;
            
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '';
            
            hideFeedback();
            renderStep();
        }

        function renderStep() {
            const data = dialogues[currentDialogueKey];
            
            if (currentStepIndex >= data.steps.length) {
                appendInterlocutorMessage("Bravo ! Vous avez terminé ce dialogue avec succès 🎉");
                document.getElementById('options-container').innerHTML = `
                    <button onclick="initDialogue()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-md">
                        Recommencer ce dialogue
                    </button>
                `;
                return;
            }

            const currentStep = data.steps[currentStepIndex];
            
            // Afficher le message de l'interlocuteur
            appendInterlocutorMessage(currentStep.interlocutor);

            // Mélanger les options aléatoirement
            const shuffledOptions = [...currentStep.options].sort(() => Math.random() - 0.5);

            // Générer les boutons d'options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-50 hover:bg-indigo-50 hover:border-indigo-400 border border-slate-200 text-slate-800 font-medium py-2.5 px-3.5 rounded-xl text-xs sm:text-sm transition-all shadow-sm active:scale-[0.99]";
                btn.innerText = opt.text;
                btn.onclick = () => handleChoice(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function handleChoice(option) {
            showFeedback(option.feedback, option.correct);

            if (option.correct) {
                appendUserMessage(option.text);
                document.getElementById('options-container').innerHTML = '';
                
                setTimeout(() => {
                    hideFeedback();
                    currentStepIndex++;
                    renderStep();
                }, 1800);
            }
        }

        function appendInterlocutorMessage(text) {
            const chatWindow = document.getElementById('chat-window');
            const msgHtml = `
                <div class="flex items-start gap-2 chat-bubble">
                    <div class="w-7 h-7 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">
                        💬
                    </div>
                    <div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-tl-none p-3 max-w-[85%] text-xs sm:text-sm shadow-sm">
                        ${text}
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', msgHtml);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function appendUserMessage(text) {
            const chatWindow = document.getElementById('chat-window');
            const msgHtml = `
                <div class="flex items-start gap-2 justify-end chat-bubble">
                    <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none p-3 max-w-[85%] text-xs sm:text-sm shadow-sm">
                        ${text}
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', msgHtml);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showFeedback(message, isCorrect) {
            const box = document.getElementById('feedback-box');
            box.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-300', 'text-emerald-900', 'bg-amber-50', 'border-amber-300', 'text-amber-900');
            
            if (isCorrect) {
                box.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
            } else {
                box.classList.add('bg-amber-50', 'border-amber-300', 'text-amber-900');
            }

            box.innerHTML = message;
        }

        function hideFeedback() {
            const box = document.getElementById('feedback-box');
            box.classList.add('hidden');
        }

        // --- INITIALISATION AU CHARGEMENT ---
        window.onload = () => {
            initDialogue();
        };
    </script>
</body>
</html>
