<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Atelier du Français — FLE A1</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-bubble {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center p-3 sm:p-6">

    <!-- En-tête principal -->
    <header class="w-full max-w-4xl mb-4 text-center">
        <h1 class="text-2xl sm:text-3xl font-bold text-indigo-700">L'Atelier du Français — A1</h1>
        <p class="text-slate-600 text-xs sm:text-sm mt-1">Application interactive de dialogues guidés</p>
    </header>

    <!-- Conteneur principal séparé en 2 colonnes sur écran large -->
    <main class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row h-[85vh] max-h-[750px] border border-slate-200">
        
        <!-- PANNEAU GAUCHE : Fiche profil & sélection du personnage -->
        <aside class="w-full md:w-72 bg-indigo-50 border-b md:border-b-0 md:border-r border-indigo-100 p-3 md:p-4 flex flex-col shrink-0">
            <!-- Choix du dialogue -->
            <label for="dialogue-selector" class="text-xs font-semibold text-indigo-900 uppercase tracking-wider mb-1.5 block">
                Sélectionner un profil
            </label>
            <select id="dialogue-selector" onchange="changeDialogue(this.value)" class="bg-white text-indigo-950 text-xs sm:text-sm font-medium rounded-lg p-2 outline-none border border-indigo-200 cursor-pointer w-full mb-3 shadow-sm">
                <option value="lucas" selected>Unité 1 : Lucas (Se présenter)</option>
                <option value="elodie">Unité 1 : Élodie (La famille)</option>
                <option value="thomas">Unité 2 : Thomas (Le week-end)</option>
            </select>

            <!-- Bouton accordéon mobile pour basculer le profil -->
            <button onclick="toggleProfile()" class="md:hidden w-full flex items-center justify-between bg-white border border-indigo-200 text-indigo-950 px-3 py-2 rounded-xl text-xs font-semibold shadow-sm mb-2 active:scale-[0.99] transition">
                <span id="profile-toggle-label" class="flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 text-indigo-600">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>
                    Fiche profil : <span id="character-name-mobile" class="font-bold">...</span>
                </span>
                <svg id="profile-chevron" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4 text-indigo-600 transition-transform duration-300">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                </svg>
            </button>

            <!-- Fiche profil détaillée (collapsible sur mobile, toujours ouverte sur desktop) -->
            <div id="profile-container" class="hidden md:flex bg-white rounded-xl p-3.5 border border-indigo-100 shadow-sm flex-1 overflow-y-auto flex-col">
                <div class="flex items-center gap-2 mb-2 pb-2 border-b border-slate-100">
                    <span id="unit-tag" class="text-[10px] uppercase tracking-wider bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full font-bold">Unité 1</span>
                </div>
                <h2 id="character-name" class="text-base font-bold text-indigo-950 mb-2">...</h2>
                <div id="profile-card" class="text-xs sm:text-sm text-slate-600 leading-relaxed space-y-1">
                    <!-- Contenu du profil injecté en JS -->
                </div>
            </div>
        </aside>

        <!-- PANNEAU DROIT : Fenêtre de discussion WhatsApp -->
        <section class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50">
            
            <!-- Barre supérieure avec bouton Retour -->
            <div class="p-3 bg-white border-b border-slate-200 flex items-center justify-between shrink-0">
                <button onclick="resetExercise()" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition border border-indigo-200">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 016 6v3" />
                    </svg>
                    <span>Retour / Recommencer</span>
                </button>
                <span class="text-xs font-medium text-slate-500" id="step-indicator">Étape 1</span>
            </div>

            <!-- Zone des messages du chat -->
            <div id="chat-window" class="flex-1 p-4 overflow-y-auto space-y-3">
                <!-- Les messages du dialogue s'affichent ici -->
            </div>

            <!-- Boîte de Feedback pédagogique -->
            <div id="feedback-box" class="hidden p-3 mx-4 my-2 rounded-xl border text-xs sm:text-sm transition-all duration-300">
                <!-- Correction explicative -->
            </div>

            <!-- Zone des propositions de réponses -->
            <div id="options-container" class="p-3 sm:p-4 border-t border-slate-200 bg-white flex flex-col gap-2 shrink-0">
                <!-- Boutons générés dynamiquement -->
            </div>
        </section>

    </main>

    <script>
        // --- DONNÉES DES DIALOGUES COMPLETES ---
        const dialogues = {
            lucas: {
                unit: "Unité 1 — Se présenter",
                title: "Lucas Moreau",
                profile: `
                    <p><b>Âge :</b> 28 ans</p>
                    <p><b>Nationalité :</b> Canadien</p>
                    <p><b>Profession :</b> Architecte</p>
                    <p><b>Ville :</b> Lyon</p>
                    <p><b>Passe-temps :</b> Photographie</p>
                `,
                steps: [
                    {
                        interlocutor: "Bonjour ! Comment vous vous appelez ?",
                        options: [
                            { text: "Bonjour, je m'appelle Lucas Moreau et vous ?", correct: true, feedback: "🥇 Excellent ! Réponse exacte et complète." },
                            { text: "Bonjour, ça va bien et vous ?", correct: false, feedback: "⚠️ On demande le prénom." },
                            { text: "Bonjour, moi c'est Lucas et toi ?", correct: false, feedback: "⚠️ L'interlocuteur a utilisé \"Vous\", marqueur de politesse." }
                        ]
                    },
                    {
                        interlocutor: "Moi c'est Julien, enchanté Lucas ! Et quel âge avez-vous ?",
                        options: [
                            { text: "J'ai 28 ans.", correct: true, feedback: "🥇 Parfait ! Structure exacte." },
                            { text: "Je suis 28 ans.", correct: false, feedback: "⚠️ En français, on utilise le verbe avoir pour donner son âge (ex: J'ai 28 ans)." },
                            { text: "Je suis né en 1998.", correct: false, feedback: "⚠️ Attention, on demande l'âge, pas la date de naissance." }
                        ]
                    },
                    {
                        interlocutor: "D'accord. Et quelle est votre nationalité ?",
                        options: [
                            { text: "Je suis canadien.", correct: true, feedback: "🥇 Très bien ! Accord masculin correct." },
                            { text: "Je suis canadienne.", correct: false, feedback: "⚠️ Attention à l'accord : Lucas est un homme, donc on utilise la forme masculine (canadien)." },
                            { text: "J'habite au Canada.", correct: false, feedback: "💡 La question porte sur la nationalité, pas sur le pays de résidence." }
                        ]
                    },
                    {
                        interlocutor: "Et qu'est-ce que vous faites dans la vie ?",
                        options: [
                            { text: "Je suis architecte.", correct: true, feedback: "🥇 Exactement ! Pas d'article devant la profession." },
                            { text: "Je suis un architecte.", correct: false, feedback: "⚠️ En français, on ne met pas d'article (un/une) devant la profession après le verbe être." },
                            { text: "Je suis un photographe.", correct: false, feedback: "⚠️ En français, on ne met pas d'article (un/une) devant la profession après le verbe être. La photographie est son passe-temps, pas sa profession principale !" }
                        ]
                    },
                    {
                        interlocutor: "Où est-ce que vous habitez actuellement ?",
                        options: [
                            { text: "J'habite à Lyon.", correct: true, feedback: "🥇 Bravo ! Bonne préposition devant une ville (à)." },
                            { text: "J'habite en Lyon.", correct: false, feedback: "⚠️ On utilise à devant les villes (à Lyon, à Paris)." },
                            { text: "J'habite au Canada.", correct: false, feedback: "💡 Sa ville actuelle est Lyon (le Canada est son pays d'origine)." }
                        ]
                    }
                ]
            },
            elodie: {
                unit: "Unité 1 — Extension Famille",
                title: "Élodie Bertrand",
                profile: `
                    <p><b>Âge :</b> 34 ans</p>
                    <p><b>Nationalité :</b> Belge</p>
                    <p><b>Profession :</b> Graphiste</p>
                    <p><b>Ville :</b> Bruxelles</p>
                    <hr class="my-1 border-indigo-100">
                    <p><b>Situation :</b> Célibataire</p>
                    <p><b>Enfants :</b> 0 enfant (1 chien : Toby)</p>
                    <p><b>Fratrie :</b> 2 frères (Julien et Thomas)</p>
                    <p><b>Parents :</b> Liège</p>
                `,
                steps: [
                    {
                        interlocutor: "Bonjour Élodie ! Dites-moi, vous êtes mariée ? Vous avez des enfants ?",
                        options: [
                            { text: "Non, je suis célibataire, mais j'ai un chien !", correct: true, feedback: "🥇 Parfait ! Utilisation exacte du statut et présence du verbe avoir (j'ai un chien)." },
                            { text: "Oui, je suis célibataire. Je suis un chien.", correct: false, feedback: "⚠️ mariée= married ; célibataire = single. Attention au verbe : on utilise avoir (j'ai un chien), pas le verbe être." },
                            { text: "Oui, je suis mariée et j'ai deux enfants.", correct: false, feedback: "💡 Regarde la fiche d'Élodie : elle est célibataire et elle a 0 enfant !" }
                        ]
                    },
                    {
                        interlocutor: "Ah un chien ! Comment il s'appelle ? Il a quel âge ?",
                        options: [
                            { text: "C'est Toby et il a 4 ans.", correct: true, feedback: "🥇 Excellent ! Bonne conjugaison du verbe avoir à la 3ᵉ personne (il a)." },
                            { text: "Il s'appelle Toby et il est 4 ans.", correct: false, feedback: "⚠ En français, on utilise le verbe avoir pour donner l'âge (il a 4 ans)." },
                            { text: "Il s'appelle Toby et il a 4.", correct: false, feedback: "⚠ L'âge est toujours suivi de 'ans'" }
                        ]
                    },
                    {
                        interlocutor: "D'accord ! Et vous avez des frères et sœurs ?",
                        options: [
                            { text: "Oui, j'ai deux frères : Julien et Thomas.", correct: true, feedback: "🥇 Bravo ! Utilisation exacte du vocabulaire de la famille (mes frères) et du verbe avoir (j'ai)." },
                            { text: "Oui, j'est deux sœurs : Julien et Thomas.", correct: false, feedback: "💡  Attention à la conjugaison : avec je, le verbe avoir s'écrit j'ai (et pas j'est). Julien et Thomas sont des prénoms masculins : ce sont ses frères !" },
                            { text: "Oui, j'est deux frères : Julien et Thomas.", correct: false, feedback: "⚠️ Attention à la conjugaison : avec je, le verbe avoir s'écrit j'ai (et pas j'est)." }
                        ]
                    },
                    {
                        interlocutor: "Qu'est-ce qu'ils font dans la vie ? Ils ont quel âge ?",
                        options: [
                            { text: "Ils ont 30 et 26 ans. Ils sont étudiants.", correct: true, feedback: "🥇 Parfait ! Bonne forme du verbe avoir au pluriel (ils ont)." },
                            { text: "Ils a 30 ans et 26 ans.", correct: false, feedback: "⚠️ Avec ils (au pluriel), le verbe avoir devient ont (ils ont)." },
                            { text: "Ils sont 30 ans et 26 ans.", correct: false, feedback: "⚠️ Attention à ne pas confondre être (ils sont) et avoir (ils ont)." }
                        ]
                    },
                    {
                        interlocutor: "Et vos parents, ils habitent à Bruxelles aussi ?",
                        options: [
                            { text: "Non, ils vivent à Liège. Et vous ?", correct: true, feedback: "🥇 Bravo ! Relance parfaite et polie avec le vouvoiement (vous avez)." },
                            { text: "Non, ils habitent à Liège. Et toi, tu as des frères et sœurs ?", correct: false, feedback: "⚠ L'interlocuteur vous vouvoie, il faut continuer à utiliser \"vous\"." },
                            { text: "Non, il habite à Liège. Et vous, vous avez des frères et sœurs ?", correct: false, feedback: "⚠️ Attention : \"les parents\" est un nom au pluriel, il faut utiliser ils (ils habitent), pas il." }
                        ]
                    }
                ]
            },
            thomas: {
                unit: "Unité 2 — On fait quoi ce week-end ?",
                title: "Thomas Blanc",
                profile: `
                    <p><b>Ville :</b> Lyon</p>
                    <p><b>Aime :</b> Sport, cinéma, musique</p>
                    <p><b>N'aime pas :</b> Le théâtre</p>
                    <hr class="my-1 border-indigo-100">
                    <p><b>Aujourd'hui :</b> Sport le matin, libre l'après-midi</p>
                    <p><b>Demain :</b> Film ou musique</p>
                `,
                steps: [
                    {
                        interlocutor: "Salut Thomas ! Qu'est-ce que tu fais ce week-end ?",
                        options: [
                            { text: "Je fais du sport le matin, et l'après-midi je ne travaille pas.", correct: true, feedback: "🥇 Parfait ! Utilisation exacte du verbe faire et de la négation ne... pas." },
                            { text: "Je fais du sport le matin, et l'après-midi je ne travaille.", correct: false, feedback: "⚠️ Attention : la négation se compose de deux mots (ne... pas)." },
                            { text: "Je fais le sport et je travaille pas.", correct: false, feedback: "⚠️️ On dit faire du sport (article partitif/contracté)." }
                        ]
                    },
                    {
                        interlocutor: "Super ! Est-ce que tu aimes le cinéma ou le théâtre ?",
                        options: [
                            { text: "J'aime le cinéma, mais je n'aime pas le théâtre.", correct: true, feedback: "🥇 Excellent ! On utilise l'article défini (le) avec les verbes de goût (aimer)." },
                            { text: "J'aime un cinéma, mais je n'aime pas le théâtre.", correct: false, feedback: "⚠️️ Attention : pour parler d'une catégorie générale avec le verbe aimer, on utilise l'article défini le (j'aime le cinéma), pas l'article indéfini un." },
                            { text: "J'aime le cinéma, mais je ne aime pas le théâtre.", correct: false, feedback: "⚠️ Devant une voyelle, ne devient n' (je n'aime pas)." }
                        ]
                    },
                    {
                        interlocutor: "Ah moi aussi j'adore le cinéma ! Alors, est-ce que tu regardes un film ce week-end ?",
                        options: [
                            { text: "Oui, je regarde un film samedi ou dimanche.", correct: true, feedback: "🥇 Parfait ! Conjugaison exacte du verbe en -er (je regarde) et utilisation de la conjonction de choix ou." },
                            { text: "Oui, je regardes un film samedi ou dimanche.", correct: false, feedback: "⚠️ Attention à la terminaison : avec je, le verbe prend un -e (je regarde), pas -es." },
                            { text: "Oui, je regarde un film, alors je n'aime pas le cinéma.", correct: false, feedback: "💡 Incohérence : alors indique une conséquence, et tu as dit précédemment que tu aimais le cinéma !" }
                        ]
                    },
                    {
                        interlocutor: "Demain après-midi, tu es libre ?",
                        options: [
                            { text: "Oui ! Demain je ne travaille pas, mais maintenant je travaille.", correct: true, feedback: "🥇 Excellent ! Utilisation exacte des adverbes demain et maintenant avec la bonne structure de négation (ne... pas)." },
                            { text: "Oui ! Aujourd'hui je ne travaille pas demain.", correct: false, feedback: "⚠️ Attention à la logique temporelle : on ne peut pas combiner aujourd'hui et demain dans la même phrase." },
                            { text: "Oui ! Aujourd'hui je ne travaille pas.", correct: false, feedback: "⚠️ Attention au moment ! L'interlocuteur demande si vous êtes libre demain. Répondre avec aujourd'hui ne confirme pas votre disponibilité pour le lendemain." }
                        ]
                    },
                    {
                        interlocutor: "D'accord ! Et maintenant, qu'est-ce que tu fais ?",
                        options: [
                            { text: "Maintenant, je travaille et j'écoute de la musique. Est-ce que tu écoutes de la musique aussi ?", correct: true, feedback: "🥇 Bravo ! Utilisation exacte du présent de l'indicatif avec l'adverbe maintenant, et bonne structure interrogative avec Est-ce que." },
                            { text: "Maintenant, je écoute de la musique. Est-ce que tu écoutes de la musique aussi ?", correct: false, feedback: "⚠️ Attention à l'élision : devant une voyelle (é), je devient j' (j'écoute)." },
                            { text: "Maintenant, j'écoutais de la musique. Écoutes-tu de la musique aussi ?", correct: false, feedback: "⚠️ Attention au temps du verbe ! L'adverbe maintenant indique une action présente. Il faut utiliser le présent (j'écoute) et non l'imparfait (j'écoutais)." }
                        ]
                    }
                ]
            }
        };

        // --- ÉTAT ET LOGIQUE D'APPLICATION ---
        let currentDialogueKey = "lucas";
        let currentStepIndex = 0;

        function changeDialogue(key) {
            currentDialogueKey = key;
            resetExercise();
        }

        function resetExercise() {
            currentStepIndex = 0;
            initDialogue();
        }

        function toggleProfile() {
            const container = document.getElementById('profile-container');
            const chevron = document.getElementById('profile-chevron');
            container.classList.toggle('hidden');
            container.classList.toggle('flex');
            chevron.classList.toggle('rotate-180');
        }

        function initDialogue() {
            const data = dialogues[currentDialogueKey];
            
            document.getElementById('unit-tag').innerText = data.unit;
            document.getElementById('character-name').innerText = data.title;
            document.getElementById('character-name-mobile').innerText = data.title;
            document.getElementById('profile-card').innerHTML = data.profile;
            
            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = '';
            
            hideFeedback();
            renderStep();
        }

        function renderStep() {
            const data = dialogues[currentDialogueKey];
            
            // Mise à jour de l'indicateur d'étape
            const indicator = document.getElementById('step-indicator');
            if (currentStepIndex < data.steps.length) {
                indicator.innerText = `Étape ${currentStepIndex + 1} / ${data.steps.length}`;
            } else {
                indicator.innerText = "Terminé";
            }

            if (currentStepIndex >= data.steps.length) {
                appendInterlocutorMessage("Bravo ! Vous avez terminé ce dialogue avec succès 🎉");
                document.getElementById('options-container').innerHTML = `
                    <button onclick="resetExercise()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-md">
                        Recommencer ce dialogue
                    </button>
                `;
                return;
            }

            const currentStep = data.steps[currentStepIndex];
            
            // Afficher le message de l'interlocuteur
            appendInterlocutorMessage(currentStep.interlocutor);

            // Mélanger les options aléatoirement
            const shuffledOptions = [...currentStep.options].sort(() => Math.random() - 0.5);

            // Générer les boutons d'options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-50 hover:bg-indigo-50 hover:border-indigo-400 border border-slate-200 text-slate-800 font-medium py-2.5 px-3.5 rounded-xl text-xs sm:text-sm transition-all shadow-sm active:scale-[0.99]";
                btn.innerText = opt.text;
                btn.onclick = () => handleChoice(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function handleChoice(option) {
            showFeedback(option.feedback, option.correct);

            if (option.correct) {
                appendUserMessage(option.text);
                document.getElementById('options-container').innerHTML = '';
                
                setTimeout(() => {
                    hideFeedback();
                    currentStepIndex++;
                    renderStep();
                }, 1800);
            }
        }

        function appendInterlocutorMessage(text) {
            const chatWindow = document.getElementById('chat-window');
            const msgHtml = `
                <div class="flex items-start gap-2 chat-bubble">
                    <div class="w-7 h-7 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">
                        💬
                    </div>
                    <div class="bg-white border border-slate-200 text-slate-800 rounded-2xl rounded-tl-none p-3 max-w-[85%] text-xs sm:text-sm shadow-sm">
                        ${text}
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', msgHtml);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function appendUserMessage(text) {
            const chatWindow = document.getElementById('chat-window');
            const msgHtml = `
                <div class="flex items-start gap-2 justify-end chat-bubble">
                    <div class="bg-indigo-600 text-white rounded-2xl rounded-tr-none p-3 max-w-[85%] text-xs sm:text-sm shadow-sm">
                        ${text}
                    </div>
                </div>
            `;
            chatWindow.insertAdjacentHTML('beforeend', msgHtml);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function showFeedback(message, isCorrect) {
            const box = document.getElementById('feedback-box');
            box.classList.remove('hidden', 'bg-emerald-50', 'border-emerald-300', 'text-emerald-900', 'bg-amber-50', 'border-amber-300', 'text-amber-900');
            
            if (isCorrect) {
                box.classList.add('bg-emerald-50', 'border-emerald-300', 'text-emerald-900');
            } else {
                box.classList.add('bg-amber-50', 'border-amber-300', 'text-amber-900');
            }

            box.innerHTML = message;
        }

        function hideFeedback() {
            const box = document.getElementById('feedback-box');
            box.classList.add('hidden');
        }

        // --- INITIALISATION ---
        window.onload = () => {
            initDialogue();
        };
    </script>
</body>
</html>
