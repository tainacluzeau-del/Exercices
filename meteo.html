<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Météo FLE - Reporters du Jour</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Open Sans', sans-serif; }
    h1, h2, h3, .font-heading { font-family: 'Chau Philomene One', cursive; }
    
    /* Animations météo CSS */
    .rain-drop {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      width: 2px;
      height: 18px;
      opacity: 0.8;
      animation: fall 0.6s linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-20px); }
      100% { transform: translateY(260px); }
    }

    .snowflake {
      position: absolute;
      color: white;
      font-size: 16px;
      animation: snowFall 3s linear infinite;
    }
    @keyframes snowFall {
      0% { transform: translateY(-10px) translateX(0); opacity: 1; }
      100% { transform: translateY(260px) translateX(20px); opacity: 0.4; }
    }

    .wind-tree {
      transform-origin: bottom center;
      animation: windSway 1.2s ease-in-out infinite alternate;
    }
    @keyframes windSway {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-18deg); }
    }

    .sun-corner {
      position: absolute;
      top: -20px;
      right: -20px;
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, rgba(253, 224, 71, 0.95) 0%, rgba(245, 158, 11, 0.6) 60%, rgba(245, 158, 11, 0) 80%);
      border-radius: 50%;
      animation: sunPulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes sunPulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    .lightning-flash {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0);
      animation: flash 4s infinite;
    }
    @keyframes flash {
      0%, 90%, 100% { background: rgba(255, 255, 255, 0); }
      92%, 94% { background: rgba(255, 255, 255, 0.6); }
    }

    .cloud-drift {
      position: absolute;
      font-size: 40px;
      opacity: 0.7;
      animation: drift 12s linear infinite;
    }
